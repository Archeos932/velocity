# =====================================================================================
#  VELOCITY - reglages graphiques (modifiable par tout le monde)
# =====================================================================================
#  Format : cle = valeurs   (nombres separes par des espaces, "#" = commentaire)
#  Couleurs : rouge vert bleu, de 0 a 1 (on peut depasser 1 pour une lumiere tres forte).
#  En jeu, appuie sur F5 pour relire ce fichier SANS relancer le jeu.
#  Une ligne effacee ou en commentaire reprend la valeur d'origine (celle ecrite ici).
#  Les captures "--shot" utilisent aussi ce fichier ; le gameplay n'est JAMAIS touche.
# =====================================================================================

# ---- Soleil ---------------------------------------------------------------------------
# direction VERS le soleil (x y z) : y = hauteur (plus petit = soleil bas, ombres longues)
soleil_direction = 0.55 0.66 -0.82
soleil_couleur   = 1.00 0.84 0.66
# intensite du soleil sur le decor (lightmaps)
soleil_force     = 1.3

# ---- Lumiere du decor (precalculee au lancement et a chaque F5) -----------------------
# lumiere du ciel dans les zones a l'ombre (plus haut = ombres moins sombres)
ciel_lumiere     = 0.52 0.54 0.74
# lumiere renvoyee par le sol sur le bas des murs
rebond_sol       = 0.16 0.13 0.12
# lueur des jump pads sur le sol : couleur, puis force et portee (m)
pads_couleur     = 0.25 0.85 1.0
pads_lueur       = 0.9 9
# finesse des ombres : texels par metre (0.5 a 8 ; plus haut = plus net mais plus lent au chargement)
lightmap_densite = 3
# occlusion ambiante (coins et pieds de murs plus sombres) : nombre de rayons (0 = aucune), portee (m)
occlusion_rayons = 12
occlusion_portee = 4.5
# lumiere minimale dans un coin totalement ferme (0 = noir, 1 = pas d'occlusion)
occlusion_min    = 0.15
# adoucissement des bords d'ombre (0 = net, 1 a 6 = de plus en plus flou)
lightmap_flou    = 2

# ---- Objets qui bougent (joueurs, ennemis, arme en main) -----------------------------
# lumiere ambiante, puis soleil : part toujours presente, part ajoutee quand l'objet est au soleil
objets_ambiant   = 0.40 0.40 0.52
objets_soleil    = 0.25 0.65
arme_ambiant     = 0.42 0.42 0.52
arme_soleil      = 0.30 0.45

# ---- Ombres des joueurs / ennemis (reglage OMBRES dans les parametres) ---------------
ombre_couleur    = 0.02 0.02 0.06
ombre_opacite    = 0.5
# au-dela de cette hauteur au-dessus du sol (m), l'ombre a disparu
ombre_hauteur_max = 30

# ---- Brouillard ----------------------------------------------------------------------
brouillard_couleur  = 0.34 0.30 0.44
# debut et fin (m) : au-dela de la fin, tout prend la couleur du brouillard
brouillard_distance = 50 240

# ---- Ciel ----------------------------------------------------------------------------
ciel_zenith      = 0.025 0.035 0.11
ciel_milieu      = 0.13 0.12 0.27
ciel_horizon     = 0.36 0.30 0.45
# halo autour du soleil : large, serre, lueur du couchant sur l'horizon
soleil_halo      = 0.30 0.55 0.42
# taille du disque, du halo moyen, du grand halo
soleil_taille    = 8 30 120
etoiles          = 260

# ---- Ville au loin (decor, sans collision) -------------------------------------------
# nombre de batiments, distance, ecart de distance, hauteur min, hauteur en plus (max)
ville            = 70 260 120 30 85
ville_couleur    = 0.16 0.14 0.26
# luminosite des fenetres allumees (0 = eteintes)
ville_fenetres   = 0.35

# ---- Bloom (halo autour de ce qui brille ; reglage BLOOM dans les parametres) --------
# force, seuil (1 = tout brille un peu ... 4 = seulement le tres lumineux), passes de flou, etalement
bloom            = 0.7 3 2 1.6

# ---- Textures ------------------------------------------------------------------------
# sol.bmp, mur.bmp et grain.bmp de ce dossier SONT les textures du jeu
# (BMP 24 bits, carre, 16 a 1024 px) : les retoucher puis F5.
# ATTENTION : tant qu'un .bmp existe, les reglages "genere" ci-dessous (sol_texture, mur_texture,
# grain_force) n'ont AUCUN effet sur sa texture.
# Pour s'en servir : supprimer le .bmp (retour a la texture generee), ou regenerer les .bmp avec
#   velocity.exe --export-textures graphismes      (ecrase les .bmp du dossier)
# taille d'une repetition de texture : sol, murs, grain (plus petit = motif plus grand) ; marche aussi avec les .bmp
texture_echelle  = 0.5 0.5 2.37
# sol genere (sans sol.bmp) : taille des dalles (8 a 256, diviseur de 256), luminosite
sol_texture      = 64 0.80
# murs generes (sans mur.bmp) : largeur et hauteur des plaques (diviseurs de 256), luminosite
mur_texture      = 128 64 0.62
# grain genere (sans grain.bmp) : force du grain fin (poussiere, micro-rayures), 0 = lisse
grain_force      = 0.22
# traits sombres sur les aretes des blocs (0 = aucun)
aretes_opacite   = 0.25
# rebond colore : un mur colore teinte le sol voisin (0 = aucun)
rebond_couleur   = 0.35

# ---- Neons du decor (plateformes : cyan, murs de wall-run : magenta, centre : orange) --
neon_cyan        = 0.2 0.95 1.0
neon_magenta     = 1.0 0.25 0.85
neon_orange      = 1.0 0.6 0.15
# eclat des bandes, lueur sur le decor (precalculee), portee de la lueur (m)
neon             = 1.0 0.55 5

# ---- Joueurs ---------------------------------------------------------------------------
# trainees de vitesse : vitesse minimale (m/s), opacite, largeur (m) ; opacite 0 = aucune
trainees         = 16 0.55 0.35
# contour de couleur autour des joueurs (epaisseur, 0 = aucun)
contours         = 3

# ---- HUD -------------------------------------------------------------------------------
# opacite des fonds sombres sous les textes du HUD (score, vitesse, armes, kills) ; 0 = aucun fond
hud_fonds        = 0.45

# ---- Second ecran ----------------------------------------------------------------------
# carte en 3D (PARAMETRES > 2e ECRAN : 3D) : champ de vision (deg), recul (x taille de la carte), inclinaison (deg, 90 = de haut)
carte_3d         = 30 2.0 52

# ---- Effets ----------------------------------------------------------------------------
# lumiere des explosions, du rail et des roquettes sur le decor (0 = aucune, 1 = normal)
lumieres_dynamiques = 1
# reflets du soleil dans l'objectif quand on le regarde (0 = aucun)
reflets_soleil   = 0.5

# ---- Meteo -----------------------------------------------------------------------------
# nuages : nombre, opacite
nuages           = 18 0.35
nuages_couleur   = 0.62 0.5 0.66
# grains de poussiere en suspension autour de toi (0 = aucun)
poussiere        = 120
# gouttes de pluie (0 = pas de pluie) ; orage = eclairs par minute (0 = aucun)
pluie            = 0
orage            = 0

# ---- Ambiances -------------------------------------------------------------------------
# PARAMETRES > CIEL choisit COUCHANT (ce fichier seul), NUIT, JOUR ou ORAGE :
# ambiance_nuit.ini, ambiance_jour.ini, ambiance_orage.ini remplacent alors une partie des valeurs.
# PARAMETRES > QUALITE : BASSE / MOYENNE plafonnent ce qui coute cher ; ULTRA = valeurs du fichier.

name: Linux

on:
  push:
    branches: [dev, stable]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04                 # glibc 2.35 : le binaire marche aussi sur les distributions plus anciennes
    steps:
      - uses: actions/checkout@v4

      - name: Paquets de developpement
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl-dev libasound2-dev libfreetype-dev xvfb libgl1-mesa-dri fonts-dejavu-core

      - name: Compiler
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh 2>&1 | tee build.log
          if grep -q "warning" build.log; then echo "::error::avertissements de compilation"; exit 1; fi

      - name: Tests automatiques (ecran virtuel)
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" Velocity-Linux/velocity --test test.txt
          cat test.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Velocity-Linux
          path: Velocity-Linux.tar.gz

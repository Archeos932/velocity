# Branche `release` : uniquement les binaires (velocity.exe, Velocity-macOS.zip, Velocity-Linux.tar.gz), construits depuis `stable`,
# et version.txt (numero de build, taille et SHA-256 de chaque binaire) lu par le bouton MISE A JOUR du jeu.
# Le numero de build est github.run_number : compile dans le jeu (VELOCITY_BUILD) et ecrit dans version.txt.
# Se lance a chaque push sur stable, ou a la main (onglet Actions > Release > Run workflow).
name: Release

on:
  push:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable

      - id: sha
        shell: bash
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compiler (MSVC)
        shell: cmd
        env:
          VELOCITY_BUILD: ${{ github.run_number }}
        run: build.bat

      - name: Tests automatiques
        shell: pwsh
        run: |
          $p = Start-Process .\velocity.exe -ArgumentList "--test","test.txt" -PassThru
          $p.WaitForExit(180000) | Out-Null
          if (-not $p.HasExited) { $p.Kill(); throw "--test : delai depasse" }
          if ($p.ExitCode -ne 0) { throw "--test : code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: Velocity-Windows
          path: velocity.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable

      - name: Compiler (universel arm64 + x86_64)
        if: hashFiles('build_mac.sh') != ''
        env:
          VELOCITY_BUILD: ${{ github.run_number }}
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
          Velocity.app/Contents/MacOS/velocity --test test.txt

      - name: Pas de port macOS dans stable
        if: hashFiles('build_mac.sh') == ''
        run: echo "::notice::stable n'a pas encore build_mac.sh, pas de binaire macOS"

      - uses: actions/upload-artifact@v4
        if: hashFiles('Velocity-macOS.zip') != ''
        with:
          name: Velocity-macOS
          path: Velocity-macOS.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable

      - name: Compiler
        if: hashFiles('build_linux.sh') != ''
        env:
          VELOCITY_BUILD: ${{ github.run_number }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl-dev libasound2-dev libfreetype-dev xvfb libgl1-mesa-dri fonts-dejavu-core
          chmod +x build_linux.sh
          ./build_linux.sh
          xvfb-run -a -s "-screen 0 1280x720x24" Velocity-Linux/velocity --test test.txt

      - name: Pas de port Linux dans stable
        if: hashFiles('build_linux.sh') == ''
        run: echo "::notice::stable n'a pas encore build_linux.sh, pas de binaire Linux"

      - uses: actions/upload-artifact@v4
        if: hashFiles('Velocity-Linux.tar.gz') != ''
        with:
          name: Velocity-Linux
          path: Velocity-Linux.tar.gz

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bin

      - name: Mettre a jour la branche release
        env:
          SHA: ${{ needs.windows.outputs.sha }}
          BUILD: ${{ github.run_number }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q rel && cd rel
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin release; then git checkout -q -b release FETCH_HEAD
          else git checkout -q --orphan release; fi
          git rm -rqf --ignore-unmatch .
          cp ../bin/Velocity-Windows/velocity.exe .
          if [ -f ../bin/Velocity-macOS/Velocity-macOS.zip ]; then cp ../bin/Velocity-macOS/Velocity-macOS.zip .; fi
          if [ -f ../bin/Velocity-Linux/Velocity-Linux.tar.gz ]; then cp ../bin/Velocity-Linux/Velocity-Linux.tar.gz .; fi
          {                                       # lu par le bouton MISE A JOUR du jeu
            echo "build=$BUILD"
            echo "sha=$SHA"
            echo "win_size=$(stat -c %s velocity.exe)"
            echo "win_sha256=$(sha256sum velocity.exe | cut -d' ' -f1)"
            if [ -f Velocity-macOS.zip ]; then
              echo "mac_size=$(stat -c %s Velocity-macOS.zip)"
              echo "mac_sha256=$(sha256sum Velocity-macOS.zip | cut -d' ' -f1)"
            fi
            if [ -f Velocity-Linux.tar.gz ]; then
              echo "linux_size=$(stat -c %s Velocity-Linux.tar.gz)"
              echo "linux_sha256=$(sha256sum Velocity-Linux.tar.gz | cut -d' ' -f1)"
            fi
          } > version.txt
          {
            echo "# VELOCITY - binaires"
            echo
            echo "Construits automatiquement depuis \`stable\` ($SHA), build $BUILD. Ne pas modifier cette branche a la main."
            echo
            echo "- Windows : \`velocity.exe\`"
            if [ -f Velocity-macOS.zip ]; then
              echo "- macOS : \`Velocity-macOS.zip\` (au premier lancement : clic droit > Ouvrir)"
            fi
            if [ -f Velocity-Linux.tar.gz ]; then
              echo "- Linux : \`Velocity-Linux.tar.gz\` (\`tar xzf Velocity-Linux.tar.gz && ./Velocity-Linux/velocity\`)"
            fi
          } > README.md
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Binaires de stable $SHA" || { echo "rien a changer"; exit 0; }
          git push -q origin release
